<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Eats SPI - Food Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Fredoka:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ocean-blue: #0EA5E9;
            --coral: #F97316;
            --sunset-pink: #FB7185;
            --lime: #84CC16;
            --sand: #FEF3C7;
            --white: #FFFFFF;
            --dark: #1E293B;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #0EA5E9 0%, #06B6D4 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated wave background */
        body::before {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,40 C300,100 600,20 900,60 C1050,80 1200,40 1200,40 L1200,120 L0,120 Z" fill="%2306B6D4" opacity="0.3"/></svg>') repeat-x;
            animation: wave 15s linear infinite;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,60 C300,30 600,90 900,50 C1050,30 1200,60 1200,60 L1200,120 L0,120 Z" fill="%2384CC16" opacity="0.2"/></svg>') repeat-x;
            animation: wave 12s linear infinite reverse;
            z-index: 0;
        }

        @keyframes wave {
            0% { background-position: 0 0; }
            100% { background-position: 1200px 0; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            display: inline-block;
            background: var(--white);
            padding: 30px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            transform: rotate(-2deg);
            margin-bottom: 20px;
        }

        .logo {
            font-family: 'Righteous', cursive;
            font-size: 4rem;
            color: var(--coral);
            text-shadow: 4px 4px 0 var(--ocean-blue);
            letter-spacing: 2px;
        }

        .palm-icon {
            display: inline-block;
            font-size: 3rem;
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .beach-logo-container {
            margin-top: 30px;
            text-align: center;
        }

        .beach-logo-container img {
            width: 400px;
            max-width: 90%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .beach-logo-container img:hover {
            transform: scale(1.02);
        }

        .tagline {
            font-size: 1.5rem;
            color: var(--white);
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        /* Admin Button */
        .admin-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--sunset-pink);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 113, 133, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .admin-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(251, 113, 133, 0.6);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal h2 {
            font-family: 'Righteous', cursive;
            color: var(--coral);
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 3px solid var(--ocean-blue);
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--coral);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--lime);
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(132, 204, 22, 0.4);
        }

        .btn-secondary {
            background: #E2E8F0;
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #CBD5E1;
        }

        /* Businesses Section */
        .businesses-section {
            margin-top: 60px;
        }

        .section-title {
            font-family: 'Righteous', cursive;
            font-size: 2.5rem;
            color: var(--coral);
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

        .businesses-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .business-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .business-card:nth-child(odd) {
            animation-delay: 0.1s;
        }

        .business-card:nth-child(even) {
            animation-delay: 0.2s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .business-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .business-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--coral), var(--sunset-pink), var(--lime));
        }

        .business-name {
            font-family: 'Righteous', cursive;
            font-size: 1.4rem;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .business-cuisine {
            color: var(--ocean-blue);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .business-hours {
            color: #64748B;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .business-contact {
            display: flex;
            flex-direction: row;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #E2E8F0;
            justify-content: center;
        }

        .business-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--ocean-blue);
            text-decoration: none;
            font-size: 1.5rem;
            background: #F0F9FF;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .business-link:hover {
            background: var(--ocean-blue);
            transform: scale(1.1);
        }

        .business-link:hover .business-link-icon {
            filter: grayscale(100%) brightness(200%);
        }

        .business-link-icon {
            font-size: 1.3rem;
        }

        .delete-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--sunset-pink);
            color: var(--white);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .business-card:hover .delete-btn.admin-mode {
            display: block;
        }

        .delete-btn:hover {
            transform: scale(1.1) rotate(90deg);
            background: #DC2626;
        }

        .edit-btn {
            display: none;
            position: absolute;
            top: 10px;
            right: 45px;
            background: var(--lime);
            color: var(--dark);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .business-card:hover .edit-btn.admin-mode {
            display: block;
        }

        .edit-btn:hover {
            transform: scale(1.1);
            background: #65A30D;
            color: var(--white);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--white);
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .empty-state-text {
            font-size: 1.5rem;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
            background: var(--white);
            border-radius: 25px;
            padding: 30px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .admin-panel.active {
            display: block;
            animation: slideInUp 0.5s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .admin-panel h3 {
            font-family: 'Righteous', cursive;
            color: var(--coral);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .logout-btn {
            background: var(--sunset-pink);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(251, 113, 133, 0.4);
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }

            .beach-logo-container img {
                width: 300px;
            }

            .tagline {
                font-size: 1.2rem;
            }

            .businesses-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <button class="admin-btn" onclick="openAdminModal()">🔐 Admin</button>

    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo">
                    <span class="palm-icon">🌴</span>
                    ISLAND EATS
                    <span class="palm-icon">🌺</span>
                </div><div class="section-title">956-374-7421</div>
            <div class="section-title">Savor the CONVENIENCE and EXPERIENCE of LOCAL FLAVORS at your doorstep! 🏝️</div>
            </div>
            
            <div class="tagline">STEP 1- Call your favorite restaurant to place your order.</div>
            <div class="tagline">STEP 2- Call Us!</div>
            <!-- Your Big Beach Logo -->
            <div class="beach-logo-container">
                <img src="5839375496797532300.jpg" alt="Island Eats Logo">
            </div>
        </header>

        <!-- Admin Panel (hidden by default) -->
        <div class="admin-panel" id="adminPanel">
            <h3 id="adminPanelTitle">🏝️ Add New Restaurant</h3>
            <div class="input-group">
                <label>Restaurant Name</label>
                <input type="text" id="addBusinessName" placeholder="e.g., Coconut Shack">
            </div>
            <div class="input-group">
                <label>Cuisine Type</label>
                <input type="text" id="addBusinessCuisine" placeholder="e.g., Hawaiian BBQ">
            </div>
            <div class="input-group">
                <label>Hours</label>
                <input type="text" id="addBusinessHours" placeholder="e.g., 11am - 9pm">
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="addBusinessPhone" placeholder="e.g., (956) 555-1234">
            </div>
            <div class="input-group">
                <label>Website</label>
                <input type="url" id="addBusinessWebsite" placeholder="e.g., https://coconutshack.com">
            </div>
            <button class="btn btn-primary" id="submitBtn" onclick="addBusiness()">Add Restaurant</button>
            <button class="btn btn-secondary" id="cancelEditBtn" onclick="cancelEdit()" style="margin-top: 10px; display: none;">Cancel Edit</button>
            <button class="btn btn-secondary" onclick="clearAllData()" style="margin-top: 10px;">Clear All Restaurants</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <!-- Businesses Section -->
        <section class="businesses-section">
            <h2 class="section-title">🍽️ Our Island Partners</h2>
            <div class="businesses-grid" id="businessesGrid">
                <div class="empty-state">
                    <div class="empty-state-icon">⏳</div>
                    <div class="empty-state-text">Loading restaurants...</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>🔐 Admin Login</h2>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Enter admin password">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="login()">Login</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Admin system
        const ADMIN_PASSWORD = 'island2024';
        let isAdmin = false;
        let editingId = null;

        // Load restaurants on page load
        loadBusinesses();

        // API calls
        async function loadBusinesses() {
            try {
                const response = await fetch('/api/restaurants');
                const businesses = await response.json();
                displayBusinesses(businesses);
            } catch (error) {
                console.error('Error loading restaurants:', error);
                document.getElementById('businessesGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <div class="empty-state-text">Error loading restaurants</div>
                    </div>
                `;
            }
        }

        function displayBusinesses(businesses) {
            const grid = document.getElementById('businessesGrid');
            
            if (businesses.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🏝️</div>
                        <div class="empty-state-text">No restaurants yet! Admin can add them above.</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = businesses.map((business) => {
                const contactHTML = (business.phone || business.website) ? `
                    <div class="business-contact">
                        ${business.phone ? `<a href="tel:${business.phone}" class="business-link" title="Call: ${business.phone}"><span class="business-link-icon">📞</span></a>` : ''}
                        ${business.website ? `<a href="${business.website}" target="_blank" class="business-link" title="Visit Website"><span class="business-link-icon">🌐</span></a>` : ''}
                    </div>
                ` : '';
                
                return `
                    <div class="business-card">
                        <button class="edit-btn ${isAdmin ? 'admin-mode' : ''}" onclick="editBusiness('${business.id}')">✏️</button>
                        <button class="delete-btn ${isAdmin ? 'admin-mode' : ''}" onclick="deleteBusiness('${business.id}')">✕</button>
                        <div class="business-name">${business.name}</div>
                        <div class="business-cuisine">🍴 ${business.cuisine}</div>
                        <div class="business-hours">⏰ ${business.hours}</div>
                        ${contactHTML}
                    </div>
                `;
            }).join('');
        }

        async function addBusiness() {
            const name = document.getElementById('addBusinessName').value.trim();
            const cuisine = document.getElementById('addBusinessCuisine').value.trim();
            const hours = document.getElementById('addBusinessHours').value.trim();
            const phone = document.getElementById('addBusinessPhone').value.trim();
            const website = document.getElementById('addBusinessWebsite').value.trim();

            if (!name || !cuisine || !hours) {
                alert('Please fill in Name, Cuisine, and Hours (required fields)!');
                return;
            }

            try {
                const method = editingId ? 'PUT' : 'POST';
                const url = editingId ? `/api/restaurants/${editingId}` : '/api/restaurants';
                
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, cuisine, hours, phone, website })
                });

                if (response.ok) {
                    editingId = null;
                    updateFormMode(false);
                    clearForm();
                    loadBusinesses();
                }
            } catch (error) {
                alert('Error saving restaurant');
                console.error(error);
            }
        }

        async function editBusiness(id) {
            if (!isAdmin) return;
            
            try {
                const response = await fetch('/api/restaurants');
                const businesses = await response.json();
                const business = businesses.find(b => b.id === id);
                
                if (business) {
                    document.getElementById('addBusinessName').value = business.name || '';
                    document.getElementById('addBusinessCuisine').value = business.cuisine || '';
                    document.getElementById('addBusinessHours').value = business.hours || '';
                    document.getElementById('addBusinessPhone').value = business.phone || '';
                    document.getElementById('addBusinessWebsite').value = business.website || '';
                    
                    editingId = id;
                    updateFormMode(true);
                    document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                alert('Error loading restaurant');
                console.error(error);
            }
        }

        async function deleteBusiness(id) {
            if (!isAdmin) return;
            
            if (confirm('Remove this restaurant?')) {
                try {
                    const response = await fetch(`/api/restaurants/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadBusinesses();
                    }
                } catch (error) {
                    alert('Error deleting restaurant');
                    console.error(error);
                }
            }
        }

        async function clearAllData() {
            if (!isAdmin) return;
            
            if (confirm('⚠️ This will delete ALL restaurants! Are you sure?')) {
                try {
                    const response = await fetch('/api/restaurants', {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadBusinesses();
                        alert('All restaurants cleared!');
                    }
                } catch (error) {
                    alert('Error clearing restaurants');
                    console.error(error);
                }
            }
        }

        function cancelEdit() {
            editingId = null;
            clearForm();
            updateFormMode(false);
        }

        function clearForm() {
            document.getElementById('addBusinessName').value = '';
            document.getElementById('addBusinessCuisine').value = '';
            document.getElementById('addBusinessHours').value = '';
            document.getElementById('addBusinessPhone').value = '';
            document.getElementById('addBusinessWebsite').value = '';
        }

        function updateFormMode(isEditing) {
            const title = document.getElementById('adminPanelTitle');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');
            
            if (isEditing) {
                title.textContent = '✏️ Edit Restaurant';
                submitBtn.textContent = 'Update Restaurant';
                cancelBtn.style.display = 'block';
            } else {
                title.textContent = '🏝️ Add New Restaurant';
                submitBtn.textContent = 'Add Restaurant';
                cancelBtn.style.display = 'none';
            }
        }

        // Admin login/logout
        function openAdminModal() {
            if (isAdmin) {
                document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
                return;
            }
            document.getElementById('loginModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('adminPassword').value = '';
        }

        function login() {
            const password = document.getElementById('adminPassword').value;
            
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                closeModal();
                document.getElementById('adminPanel').classList.add('active');
                document.querySelector('.admin-btn').textContent = '✅ Admin';
                loadBusinesses();
            } else {
                alert('Incorrect password!');
            }
        }

        function logout() {
            isAdmin = false;
            editingId = null;
            clearForm();
            updateFormMode(false);
            document.getElementById('adminPanel').classList.remove('active');
            document.querySelector('.admin-btn').textContent = '🔐 Admin';
            loadBusinesses();
        }
    </script>
</body>
</html>
